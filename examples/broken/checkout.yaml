apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  labels:
    app: checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
        - name: api
          image: registry.example.com/checkout:latest
          securityContext:
            privileged: true
          ports:
            - containerPort: 8080
      volumes:
        - name: host-socket
          hostPath:
            path: /var/run/docker.sock
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
spec:
  selector:
    app: checkout-api
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: checkout
spec:
  rules:
    - host: checkout.example.com
      http:
        paths:
          - path: /
            backend:
              serviceName: checkout
              servicePort: 80
